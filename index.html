<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem Cell Simulator</title>
  <meta name="description" content="3D stem-cell differentiation and morphogenesis simulator: multi-order signaling pathways, cell mechanics, morphogen fields and protein assembly, calibrated on real microscopy.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2313493f'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23ff6fae' stroke-width='2'/%3E%3Ccircle cx='13' cy='13' r='6' fill='%235ee0c1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="nav-toggle" class="icon-btn" aria-label="Scenes" title="Scenes">&#9776;</button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Stem&nbsp;Cell&nbsp;Simulator</span>
      </div>
      <div id="scene-heading">
        <span id="scene-order" class="chip"></span>
        <h1 id="scene-title">Loading…</h1>
      </div>
      <div class="toolbar">
        <div class="seg" id="mode-switch" role="radiogroup" aria-label="Render mode">
          <button data-mode="physical" class="active" title="Physical 3D rendering">3D</button>
          <button data-mode="confocal" title="Confocal fluorescence look">Confocal</button>
          <button data-mode="histology" title="H&amp;E histology look">H&amp;E</button>
        </div>
        <button id="panel-toggle" class="icon-btn" aria-label="Controls" title="Controls">&#9881;</button>
      </div>
    </header>

    <nav id="sidebar" aria-label="Scenes"></nav>

    <main id="viewport">
      <canvas id="gl"></canvas>
      <div id="hud">
        <div id="hud-legend"></div>
        <div id="hud-tip" hidden></div>
      </div>
      <div id="loading" class="loading"><div class="spinner"></div><span>Loading scene…</span></div>
      <div id="transport">
        <button id="btn-play" class="icon-btn" title="Pause / play (space)">&#10074;&#10074;</button>
        <button id="btn-reset" class="icon-btn" title="Reset scene (r)">&#8634;</button>
        <label class="speed">speed
          <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1">
        </label>
        <span id="sim-time" class="mono">t = 0</span>
        <label class="clip" title="Virtual optical section: clip the scene with a plane">
          <input id="clip-on" type="checkbox"> section
          <input id="clip-pos" type="range" min="-1" max="1" step="0.005" value="0">
        </label>
        <button id="btn-shot" class="icon-btn" title="Save screenshot">&#128247;</button>
      </div>
    </main>

    <aside id="panel" aria-label="Scene controls">
      <section id="scene-about"></section>
      <section id="scene-controls"></section>
    </aside>
  </div>
  <noscript>This simulator needs JavaScript and WebGL 2.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
