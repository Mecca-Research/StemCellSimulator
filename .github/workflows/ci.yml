name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Model unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/models/*.test.mjs

  pipeline:
    name: Micrograph pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Fetch reference micrographs (SHA-256 verified)
        run: python tools/fetch_micrographs.py
      - run: python -m pytest -q tests/tools
      - name: Rebuild derived assets from the raw data
        run: python tools/build_assets.py
      - name: Measurements are reproducible
        run: |
          git diff --stat -- assets/derived
          git diff --exit-code -- 'assets/derived/*.json'

  e2e:
    name: Every 3D scene renders (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/smoke.mjs --all --modes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-screenshots
          path: tests/e2e/out/
          retention-days: 14
